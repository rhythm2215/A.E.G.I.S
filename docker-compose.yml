version: '3.8'

services:
  # ── React 19 Frontend ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend

  # ── FastAPI Backend & Telemetry Broker ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CAMERA_SOURCE=browser
      - DATABASE_URL=postgresql://aegis_user:aegis_secure_password@postgres:5432/aegis_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aegis_minio_admin
      - MINIO_SECRET_KEY=aegis_minio_secret_key
    depends_on:
      - postgres
      - minio

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_secure_password
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── MinIO S3 Storage ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis_minio_admin
      MINIO_ROOT_PASSWORD: aegis_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
